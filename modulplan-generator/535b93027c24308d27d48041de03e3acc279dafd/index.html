<!doctype html>
<html lang="de" xmlns:C="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <title>Stylegreen Modulplan Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0" />
    <link href="./css/bootstrap.min.css" rel="stylesheet" type="text/css" media="all">
    <link href="./css/font-awesome.min.css" rel="stylesheet" type="text/css" media="all">
    <link href="./css/custom.css" rel="stylesheet" type="text/css" media="all">
    <link rel="icon" type="image.png" href="./img/sG_logo.png">
    <script type="module" src="./js/stylegreen_scripts.js"></script>
    <script src="./js/enums.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script type="module" src="./js/image_encoding.js"></script>
</head>
<body>
<div class="main-container">
    <section>
        <div class="container">
            <div class="row">
                <div class="col-md-12 content">
                    <a href="./index.html">
                        <img class="stylegreen-logo" alt="Stylegreen Logo" src="./img/stylegreen_logo_newCI2-removebg-preview.png">
                    </a>
                </div>
                <div class="col-md-12 content">
                    <h1 class="uppercase text-center">Your Moduleplans</h1>
                    <form class="form-email" id="calculation-form">
                        <div class="row">
                            <input type="text" class="validate-required" name="customer"    placeholder="Customer Name" id="customer-form"/>
                            <input type="text" class="validate-required" name="or_form"     placeholder="or-number"     id="or-form"/>
                        </div>
                        <div id="container" class=" card row"></div>
                        <button type="button" class="btn btn-light" id="addNewFormButton">&nbsp; <span style=font-weight:bold;"><b>&#x2b</b> Add new Form</span></button>
                        <div class="container">
                            <button type="submit" disabled id="submit-form" class="disabled-form">Moduleplan as PowerPoint! GER and ENG</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script type="module" src="./js/image_encoding.js"></script>
<script type="module" src="./js/pptxgen.bundle.js"></script>
<script>
    $(document).ready(function () {
        console.log("...loading HTML!");
    });
    const formListContainer =   $("#container");
    let submitForm =            $("#submit-form");
    let previousCustomer;
    let previousOR;

    class PlanList {
        plans = [];
        maxPlans = 50;

        appendForm(planForm) {
            this.plans.push(planForm);
            this.updateIds();
            updateDom();
        }

        deleteForm(planId) {
            this.plans = this.plans.filter(plan => plan.planId !== planId);
            $(`#${planId}`).remove();
            if (formListContainer.children().length === 0) {
                this.plans = [];
            }
            this.updateIds();
            updateDom();
            validateForm();
        }

        updateIds() {
            this.plans.forEach((plan, index) => {
                plan.planId = index + 1;
                updatePlanInDOM(plan);
            });
            updateDom();
        }
        getNextId() {
            return this.plans.length + 1;
        }
    }
    window.planlist = new PlanList();

    class PlanForm {
        constructor(planId, height, width, edge, alucolor, moss, fireProtec){
            this.planId =   planId;
            this.height =   height;
            this.width =    width;
            this.edge =     edge;
            this.alucolor = alucolor;
            this.moss =     moss;
            this.fireProtec = fireProtec;
        }
    }
    document.head = document.head || document.getElementsByTagName('head')[0];

    function addNewPlan() {
        if (planlist.plans.length >= planlist.maxPlans) {
            alert("Maximum Number of Plans reached (20).");
            return;
        }
        let nextId = planlist.getNextId();
        let planform = new PlanForm(nextId);
        planlist.appendForm(planform);
        createPlanForm(planform.planId);
        //validateForm();
    }

    document.getElementById("addNewFormButton").addEventListener("click", function () {
        addNewPlan();
        updateDom();
        validateForm();
    });

    //creation of new Plan in DOM element with added eventlistener/logic to them
    function createPlanForm(planId) {
        formListContainer.append(`
                    <div id="${planId}">
                        <div class="col-xs-12 form-section" data-id="${planId}">
                            <h2>Plan ${planId}</h2>
                        </div>
                        <div class="col-xs-6">
                            <input type="number" step="0.1" class="validate-required" name="width" placeholder="Width (in cm)" min="10" max="1200" id="width-${planId}">
                        </div>
                        <div class="col-xs-6">
                            <input type="number" step="0.1" class="validate-required" name="height" placeholder="Heigth (in cm)" min="10" max="1200" id="height-${planId}">
                        </div>
                        <div class="col-xs-12">
                            <select name="Plates" id="fireProtec-select-${planId}">
                                <option id="A2_carrier_plates-${planId}" value="A2">A2 Carrier Plate (Concrete)</option>
                                <option id="MDF-${planId}" selected value="MDF">MDF-Plate</option>
                            </select>
                            <select name="edge" id="edge-select-${planId}">
                                <option value="" disabled selected>edge choices</option>
                                <option id="edge-alu-${planId}" value="alu">Aluminium edge</option>
                                <option id="edge-green-${planId}" value="green">Green edge</option>
                                <option id="edge-without-${planId}" value="without">No edge finishing</option>
                            </select>
                            <select name="alucolor" id="alu-color-${planId}" class="hidden">
                                <option value="" disabled selected>color of aluminiumedge</option>
                                <option id="alucolor-white-${planId}" value="white">White</option>
                                <option id="alucolor-silver-${planId}" value="silver">Silver</option>
                                <option id="alucolor-black-${planId}" value="black">Black</option>
                            </select>
                            <select name="moss" id="moss-select-${planId}" class="hidden">
                                <option value="" disabled selected>kind of moss</option>
                                <option id="moss-island-${planId}" value="reindeermoss">Reindeermoss</option>
                                <option id="moss-forest-${planId}" value="flatmoss">Flatmoss</option>
                                <option id="ball-moss-${planId}" value="ballmoss">Ballmoss</option>
                            </select>
                            <button id="deleteButton-${planId}" data-plan-id="${planId}" type="button" class="btn btn-light">Plan ${planId} löschen</button>
                        </div>
                    </div>
                `);
        document.getElementById(`deleteButton-${planId}`).addEventListener("click", function () {
            planlist.deleteForm(planId);
            //document.getElementById(`${planId}`).remove();
            updateDom();
            let deleteButton = this;
            setTimeout(() => {
                deleteButton.disabled = false
            })
        });
        const aluColorSelect =  document.getElementById(`alu-color-${planId}`);
        const mossSelect =      document.getElementById(`moss-select-${planId}`);
        const edge_select =     $(`#edge-select-${planId}`);
        edge_select.on("change", function () {
            let selectedValue = this.value;
            aluColorSelect.classList.add('hidden');
            mossSelect.classList.add('hidden');
            if (selectedValue === "alu") {
                aluColorSelect.classList.remove('hidden');
            } else if (selectedValue === "green") {
                mossSelect.classList.remove('hidden');
            }
        });
    }

    //to visually update the DOM
    function updatePlanInDOM(plan) {
        const planId = plan.planId;
        $(`#plan-${planId} h2`).text(`Plan ${planId}`);
        $(`#width-${planId}`).attr('id', `width-${planId}`);
        $(`#height-${planId}`).attr('id', `height-${planId}`);
        $(`#edge-select-${planId}`).attr('id', `edge-select-${planId}`);
        $(`#alu-color-${planId}`).attr('id', `alu-color-${planId}`);
        $(`#moss-select-${planId}`).attr('id', `moss-select-${planId}`);
        $(`#fireProtec-select-${planId}`).attr('id', `fireProtec-select-${planId}`);
        $(`#deleteButton-${planId}`).attr('id', `deleteButton-${planId}`).data('plan-id', planId);
    }

    //to Update numbers/indices after inserting/deleting new Plans
    function updateDom() {
        const formListContainer = document.getElementById('container');
        const plans = formListContainer.children;

        for (let i = 0; i < plans.length; i++) {
            const plan = plans[i];
            const planId = i + 1;

            const planTitle = plan.querySelector('h2');
            if (planTitle) {
                planTitle.textContent = `Plan ${planId}`;
            }
            let v = planId.toString();
            plan.querySelectorAll('input, select, button').forEach(element => {
                element.id =    element.id.replace(/\d+$/, v);
                element.name =  element.name.replace(/\d+$/, planId);
            });
            const deleteButton = plan.querySelector(`button[id^="deleteButton-"]`);
            if (deleteButton) {
                deleteButton.id = `deleteButton-${planId}`;
                document.getElementById(`deleteButton-${planId}`).textContent = `Delete Plan ${planId}`;
            }
        }
    }

    function validateForm() {
        let currentCustomer = $("#customer-form").val();
        let currentORnumber = $("#or-form").val();
        let plans =             formListContainer.children('div');
        let totalPlans =      plans.length;
        let validPlans =        0;

        if (!currentCustomer) {
            submitForm.prop("disabled", true).addClass("disabled-form");
            return;
        }
        if (!currentORnumber){
            submitForm.prop("disabled", true).addClass("disabled-form");
            return;
        }
        plans.each(function () {
            const planId =      $(this).attr('id');
            const width =       $(`#width-${planId}`).val();
            const height =      $(`#height-${planId}`).val();
            const edge =        $(`#edge-select-${planId}`).val();
            const alucolor =    $(`#alu-color-${planId}`).val();
            const moss =        $(`#moss-select-${planId}`).val();
            const fireProtec =  $(`#fireProtec-select-${planId}`).val();

            let isEdgeValid;
            if (fireProtec && width >= 10 && width <= 1200 && height >= 10 && height <= 1200){
                isEdgeValid = edge === 'without' ||
                    (edge === 'alu' && alucolor) ||
                    (edge === 'green' && moss);
                if (isEdgeValid){ validPlans++; }
            }
        });
        if (validPlans === totalPlans && validPlans > 0) {
            submitForm.prop("disabled", false).removeClass("disabled-form");
        } else {
            submitForm.prop("disabled", true).addClass("disabled-form");
        }
    }

    $("#customer-form").on('input change', function () {
        previousCustomer = $(this).val();
        validateForm();
    });
    $("#or-form").on('input change', function (){
        previousOR = $(this).val();
        validateForm();
    });
    $(document).on('input change', 'input, select', function () {
        validateForm();
    });

    //Mapping and transfer of Data from web html
    document.getElementById("calculation-form").addEventListener("submit", function (event) {
        event.preventDefault();
        const customer =    $(`#customer-form`).val();
        const or_number =   $('#or-form').val();
        const plans = planlist.plans.map(plan => {
            return {
                planId:     plan.planId,
                width:      $(`#width-${plan.planId}`).val(),
                height:     $(`#height-${plan.planId}`).val(),
                edge:       $(`#edge-select-${plan.planId}`).val(),
                alucolor:   $(`#alu-color-${plan.planId}`).val(),
                moss:       $(`#moss-select-${plan.planId}`).val(),
                fireProtec: $(`#fireProtec-select-${plan.planId}`).val()
            };
        });
        const formData = {
            customer:   customer,
            or_number:  or_number,
            plans:      plans
        }
        let pptx = new PptxGenJS();
        let deutsch = "deutsch";
        let english = "english";
        etas(formData, pptx, deutsch);
        etas(formData, pptx, english);
    });
</script>
</body>
</html>
